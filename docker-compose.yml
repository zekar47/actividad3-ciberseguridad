services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: actividad3-localstack
    expose:
      - "4566"
    environment:
      - SERVICES=s3,iam,sts
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=1
      - DEBUG=0
    volumes:
      - "./.localstack:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
